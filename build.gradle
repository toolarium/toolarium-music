apply from: "https://raw.githubusercontent.com/toolarium/common-gradle-build/master/gradle/common.gradle"


/************************************************************************************************************************
 * CLI source set: contains ToolariumMusic and its picocli dependency.
 * It compiles on top of the main output so it can reference the library classes,
 * but picocli is NOT added to the main configuration and therefore does NOT appear
 * in the published library POM.
 ************************************************************************************************************************/
sourceSets {
    cli {
        java {
            srcDirs = ["src/cli/java"]
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
}


/************************************************************************************************************************
 * Define project dependencies
 ************************************************************************************************************************/
dependencies {
    // logging
    implementation "org.slf4j:slf4j-api:${commonGradleSlf4jApiVersion}"
    testRuntimeOnly "ch.qos.logback:logback-classic:${commonGradleLogbackVersion}"

    // jackson xml
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.18.2"
    implementation "com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.18.2"

    // command-line argument parsing and logging (cli source set only; not part of the library's public API)
    cliImplementation "info.picocli:picocli:4.7.6"
    cliRuntimeOnly "ch.qos.logback:logback-classic:${commonGradleLogbackVersion}"

    // toolarium common utilities
    testImplementation "com.github.toolarium:toolarium-common:1.2.1"

    // RELAX NG validation of the written MEI files (jing only, without its optional Saxon and Xerces dependencies)
    testImplementation("org.relaxng:jing:20220510") {
        transitive = false
    }
}


/************************************************************************************************************************
 * Fat executable JAR (classifier: cli).
 * Bundles all runtime dependencies together with the library and the CLI entry point
 * so the tool can be launched with: java -jar toolarium-music-X.Y.Z-cli.jar [options] FILE|DIR...
 ************************************************************************************************************************/
tasks.register("cliJar", Jar) {
    group = "build"
    description = "Assembles the fat executable JAR with all runtime dependencies bundled."
    archiveClassifier.set("cli")
    manifest {
        attributes "Main-Class": "com.github.toolarium.music.ToolariumMusic"
    }
    from sourceSets.main.output
    from sourceSets.cli.output
    from sourceSets.cli.runtimeClasspath.filter { it.isFile() }.collect { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

assemble.dependsOn cliJar


/************************************************************************************************************************
 * Checkstyle: the music sample files in the test resources are test input, not source code (some are larger than
 * the checkstyle heap allows)
 ************************************************************************************************************************/
tasks.withType(Checkstyle).configureEach {
    exclude "**/samples/**"
}

// checkstyleCli is auto-created by the Checkstyle plugin when the cli source set is defined.
// Wire it into the build so it runs alongside checkstyleMain.
check.dependsOn tasks.named("checkstyleCli")


/************************************************************************************************************************
 * Sources jar: the music sample files in the test resources and their description are not published
 ************************************************************************************************************************/
tasks.matching { it.name == "sourcesJar" }.configureEach {
    exclude "**/samples/**"
    exclude "**/test/resources/README.md"
}


/************************************************************************************************************************
 * Test JVM configuration
 ************************************************************************************************************************/
test {
    maxHeapSize = "2g"
    jvmArgs '-XX:+UseG1GC'
    systemProperty "toolarium.music.integrationTest", "false"
    if (project.hasProperty("testThreads")) {
        systemProperty "toolarium.music.testThreads", project.property("testThreads")
    }
}


/************************************************************************************************************************
 * Integration tests: the same tests on all samples, including the protected samples (src/test/resources/samples/_protected_)
 ************************************************************************************************************************/
tasks.register("integrationTest", Test) {
    description = "Runs the tests on all samples, including the protected samples."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxHeapSize = "4g"
    jvmArgs '-XX:+UseG1GC'
    systemProperty "toolarium.music.integrationTest", "true"
    if (project.hasProperty("testThreads")) {
        systemProperty "toolarium.music.testThreads", project.property("testThreads")
    }
    shouldRunAfter test
}
